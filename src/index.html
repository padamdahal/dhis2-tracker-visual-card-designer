<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Card Designer — DHIS2</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Jodit Editor -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jodit/4.6.13/es2021/jodit.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jodit/4.6.13/es2021/jodit.min.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="topbar-left">
    <span class="logo">⬡ Card Designer</span>
    <select id="programSelect" class="program-select"></select>
  </div>
  <div class="topbar-right">
    <span id="saveStatus" class="save-status"></span>
    <button id="btnLoad" class="btn btn-ghost">↺ Load</button>
    <button id="btnSave" class="btn btn-primary">💾 Save</button>
    <button id="btnShowJson" class="btn btn-ghost">{ } View JSON</button>
  </div>
</header>

<!-- MAIN LAYOUT -->
<div class="app-layout">

  <!-- LEFT PANEL -->
  <aside class="panel-left">
    <div class="panel-section">
      <div class="panel-title">Tracked Entity Attributes</div>
      <input id="teaSearch" class="search-input" type="text" placeholder="Search…" />
      <div id="teaList" class="field-list"></div>
    </div>
    <div class="panel-section">
      <div class="panel-title">Data Elements</div>
      <input id="deSearch" class="search-input" type="text" placeholder="Search…" />
      <div id="deList" class="field-list"></div>
    </div>
  </aside>

  <!-- CENTER: Sections + JSON panel -->
  <main class="editor-area">
    <!-- Card meta -->
    <div class="card-meta-bar">
      <div class="meta-field">
        <label>Datastore Key</label>
        <input id="datastoreKey" class="meta-input" type="text" placeholder="e.g. opdSummary" />
      </div>
      <div class="meta-field">
        <label>Card ID</label>
        <input id="cardId" class="meta-input" type="text" placeholder="e.g. opdSummary" />
      </div>
      <div class="meta-field">
        <label>Card Name</label>
        <input id="cardName" class="meta-input" type="text" placeholder="e.g. OPD Summary" />
      </div>
      <div class="meta-field meta-field-wide">
        <label>Access At</label>
        <input id="cardAccessAt" class="meta-input" type="text" value="everywhere | enrollment-dashboard | new-edit-event | view-event" />
      </div>
      <button id="btnAddSection" class="btn btn-primary">+ Add Section</button>
    </div>

    <div id="sectionsContainer"></div>
  </main>

  <!-- RIGHT: JSON output panel -->
  <aside class="json-panel" id="jsonPanel">
    <div class="json-panel-header">
      <span>JSON Output</span>
      <div style="display:flex;gap:6px;align-items:center;">
        <span id="jsonCopyFeedback" class="copy-feedback"></span>
        <button id="btnCopyJson" class="btn btn-primary btn-sm">Copy</button>
        <button id="btnCloseJson" class="btn btn-ghost btn-sm">✕</button>
      </div>
    </div>
    <pre id="jsonOutput" class="json-output"></pre>
  </aside>

</div>

<!-- LOAD TEMPLATE MODAL -->
<div id="loadModal" class="modal hidden">
  <div class="modal-box modal-sm">
    <div class="modal-header">
      <span>Load Template</span>
      <button class="modal-close" id="closeLoadModal">✕</button>
    </div>
    <div class="modal-body">
      <div id="loadKeyList" class="load-key-list">
        <div class="load-key-empty">Loading saved templates…</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="cancelLoadModal">Cancel</button>
    </div>
  </div>
</div>



<!-- SECTION TEMPLATE -->
<template id="sectionTemplate">
  <div class="section-block" data-section-id="">
    <div class="section-header">
      <div class="section-header-left">
        <span class="drag-handle" title="Drag to reorder">⠿</span>
        <input class="section-name-input" type="text" value="Section" />
      </div>
      <div class="section-header-right">
        <div class="type-toggle">
          <button class="type-btn active" data-type="single">Single</button>
          <button class="type-btn" data-type="repeatable">Repeatable</button>
        </div>
        <select class="stage-select hidden" title="Program stage (optional)"></select>
        <button class="btn-icon btn-collapse" title="Collapse">▲</button>
        <button class="btn-icon btn-delete-section" title="Delete section">✕</button>
      </div>
    </div>

    <div class="section-body">
      <div class="editor-wrap-header hidden">
        <div class="sub-editor-label">Header HTML <span class="sub-hint">(printed once — e.g. opening &lt;table&gt; + column headers)</span></div>
        <div class="editor-slot editor-slot-header"></div>
      </div>

      <div class="sub-editor-label sub-editor-label-body">Body HTML <span class="sub-hint body-hint">(repeats once per row when section is Repeatable)</span></div>
      <div class="editor-slot editor-slot-body"></div>

      <div class="editor-wrap-footer hidden">
        <div class="sub-editor-label">Footer HTML <span class="sub-hint">(printed once — e.g. closing &lt;/table&gt;)</span></div>
        <div class="editor-slot editor-slot-footer"></div>
      </div>
    </div>
  </div>
</template>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/expressionEngine.js"></script>
<script src="js/richEditor.js"></script>
<script src="js/sections.js"></script>
<script src="js/fieldPanel.js"></script>
<script src="js/app.js"></script>
</body>
</html>
